<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0b2733"/>
      <stop offset="55%" stop-color="#051a22"/>
      <stop offset="100%" stop-color="#020a0e"/>
    </radialGradient>

    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d3a4a" stroke-width="1"/>
    </pattern>

    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGlow)"/>
    <rect width="512" height="512" fill="url(#grid)" opacity="0.35"/>

    <!-- corner scan brackets -->
    <g stroke="#00d4aa" stroke-width="3" fill="none" opacity="0.55">
      <path d="M28 70 V32 H66"/>
      <path d="M446 32 H484 V70"/>
      <path d="M484 442 V480 H446"/>
      <path d="M66 480 H28 V442"/>
    </g>

    <!-- Circuit traces -->
    <g stroke="#0f4a5c" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M40 256 H120 M40 256 a4 4 0 1 0 0.1 0"/>
      <path d="M472 256 H392"/>
      <path d="M256 40 V120"/>
      <path d="M256 472 V392"/>
      <path d="M96 128 L150 128 L180 158"/>
      <path d="M416 128 L362 128 L332 158"/>
      <path d="M96 384 L150 384 L180 354"/>
      <path d="M416 384 L362 384 L332 354"/>
    </g>
    <g fill="#00f5a0">
      <circle cx="40" cy="256" r="5"/>
      <circle cx="472" cy="256" r="5"/>
      <circle cx="96" cy="128" r="4"/>
      <circle cx="416" cy="128" r="4"/>
      <circle cx="96" cy="384" r="4"/>
      <circle cx="416" cy="384" r="4"/>
    </g>

    <!-- Outer hexagon (circuit-board frame) -->
    <polygon points="256,54 410,142 410,318 256,406 102,318 102,142"
      fill="none" stroke="url(#hexStroke)" stroke-width="6" filter="url(#glowSoft)"/>
    <polygon points="256,54 410,142 410,318 256,406 102,318 102,142"
      fill="none" stroke="#00f5a0" stroke-width="1" opacity="0.4"/>

    <!-- Inner hexagon panel -->
    <polygon points="256,92 378,160 378,300 256,368 134,300 134,160"
      fill="#03141b" stroke="#0d3a4a" stroke-width="2"/>

    <!-- hex vertex nodes -->
    <g fill="#00f5a0" filter="url(#glowSoft)">
      <circle cx="256" cy="54" r="6"/>
      <circle cx="410" cy="142" r="6"/>
      <circle cx="410" cy="318" r="6"/>
      <circle cx="256" cy="406" r="6"/>
      <circle cx="102" cy="318" r="6"/>
      <circle cx="102" cy="142" r="6"/>
    </g>

    <!-- Code bracket + slash emblem -->
    <g filter="url(#glowStrong)">
      <path d="M198 168 L150 230 L198 292" fill="none" stroke="url(#bracketGrad)"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M314 168 L362 230 L314 292" fill="none" stroke="url(#bracketGrad)"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M282 148 L228 312" fill="none" stroke="url(#slashGrad)"
        stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- blinking cursor block -->
    <rect x="238" y="332" width="34" height="14" rx="2" fill="#00f5a0" filter="url(#glowSoft)"/>

    <!-- terminal prompt caret under emblem -->
    <path d="M170 250 l14 12 l-14 12" fill="none" stroke="#00b4d8" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- scanline overlay -->
    <g opacity="0.06">
      <rect x="0" y="0" width="512" height="512" fill="url(#grid)"/>
    </g>
    <g opacity="0.15">
      <rect x="0" y="80" width="512" height="2" fill="#00f5a0"/>
      <rect x="0" y="240" width="512" height="2" fill="#00f5a0"/>
      <rect x="0" y="400" width="512" height="2" fill="#00f5a0"/>
    </g>

    <!-- vignette -->
    <rect width="512" height="512" fill="url(#bgGlow)" opacity="0" />
  </g>

  <!-- rounded frame border -->
  <rect x="3" y="3" width="506" height="506" rx="94" ry="94"
    fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.35"/>
</svg>
